# Continuous integration: on every push and pull request it starts a PostgreSQL,
# applies the migrations, runs the tests, checks the seed and lints the code.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    # Throwaway database for this run (production is never touched).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diagnostico_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/diagnostico_test
      JWT_SECRET: throwaway-secret-for-continuous-integration-only
      ADMIN_PASSWORD: throwaway-password-for-continuous-integration-only

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply the migrations
        run: alembic upgrade head

      - name: Run the tests
        run: pytest -q

      - name: Check that the seed works
        run: python -m app.seed

      - name: Lint the code
        run: |
          pip install ruff==0.15.22
          ruff check app tests
