# Render deployment blueprint:
#   - the API (FastAPI) as a Web Service
# The database is NOT here: it lives on Neon, whose free plan does not expire, while a free
# Render database is deleted 30 days after it is created. Its connection string is set by hand
# in the Render dashboard (see docs/DESPLIEGUE.md).

services:
  - type: web
    name: diagnostico-api
    runtime: python
    plan: free
    # Build: installs dependencies, applies migrations and loads the base data (seed).
    buildCommand: "pip install -r requirements.txt && alembic upgrade head && python -m app.seed"
    # Start: uvicorn listening on the port Render injects ($PORT).
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL           # Neon connection string: set by hand in the dashboard
        sync: false
      - key: JWT_SECRET             # token secret: Render generates a random one
        generateValue: true
      - key: ADMIN_PASSWORD         # admin password: set by hand in the dashboard
        sync: false
      - key: FRONTEND_ORIGINS       # origins allowed by CORS, separated by commas
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
