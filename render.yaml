# Render deployment blueprint (everything on one provider):
#   - the API (FastAPI) as a Web Service
#   - its PostgreSQL database
# Render reads this file and creates both services automatically.

databases:
  - name: diagnostico-db
    plan: free

services:
  - type: web
    name: diagnostico-api
    runtime: python
    plan: free
    # Build: installs dependencies, applies migrations and loads the base data (seed).
    buildCommand: "pip install -r requirements.txt && alembic upgrade head && python -m app.seed"
    # Start: uvicorn listening on the port Render injects ($PORT).
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL           # the database connection, plugged in by Render
        fromDatabase:
          name: diagnostico-db
          property: connectionString
      - key: JWT_SECRET             # token secret: Render generates a random one
        generateValue: true
      - key: ADMIN_PASSWORD         # admin password: set by hand in the dashboard
        sync: false
      - key: FRONTEND_ORIGINS       # origins allowed by CORS, separated by commas
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
